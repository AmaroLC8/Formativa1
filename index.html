<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Tienda Web</h1>
        <nav>
            <a href="inicio.html">Inicio</a> | 
            <a href="catalogo.html">Catálogo</a> | 
            <a href="index.html">Registro</a>
        </nav>
    </header>

    <main>
        <section>
            <article>
                <h2>Únete a nuestra comunidad</h2>
                <p>Regístrate ingresando tus datos a continuación.</p>
                
                <form id="registroForm">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ej: Juan Pérez">
                    
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="ejemplo@correo.com">
                    
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres">

                    <div id="mensajeError" style="color: red; font-weight: bold; margin-top: 5px;"></div>

                    <button type="submit">Registrarme</button>
                </form>
            </article>
        </section>
        
        <section>
            <article>
                <h3>Conoce más sobre nuestros productos</h3>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="Video de la tienda" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </article>
        </section>
    </main>

    <footer>
        <p>Equipo de Desarrollo Fullstack II - 2024</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
