<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Tienda Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mi Tienda Web</h1>
        <nav>
            <a href="inicio.html">Inicio</a> | 
            <a href="catalogo.html">Catálogo</a> | 
            <a href="index.html">Registro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Nuestro Catálogo de Productos</h2>
            <p>Descubre lo que tenemos para ti. ¡Regístrate para comprar!</p>
            
            <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
                <article style="border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
                    <h3>Producto 1</h3>
                    <img src="images/producto1.jpg" alt="Producto 1">
                    <p>Precio: $15.000</p>
                </article>

                <article style="border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
                    <h3>Producto 2</h3>
                    <img src="images/producto2.jpg" alt="Producto 2">
                    <p>Precio: $25.000</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Equipo de Desarrollo Fullstack II - 2024</p>
    </footer>
</body>
</html>
